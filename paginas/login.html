<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - El Bajón Urbano</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>


  <header class="navbar">
    <div class="nav-contenedor">
      <div class="nav-grupo-izq">
        <a href="../index.html" class="logo">El Bajón Urbano</a>
        <nav class="nav-links" id="navLinks">
          <a href="../index.html" class="btn-nav">Home</a>
          <a href="./productos.html" class="btn-nav">Productos</a>
          <a href="./nosotros.html" class="btn-nav">Nosotros</a>
          <a href="./blogs.html" class="btn-nav">Blogs</a>
          <a href="./contacto.html" class="btn-nav">Contacto</a>
        </nav>
      </div>

      <div class="nav-grupo-der">
        <a href="./login.html" class="btn-nav-accion active">Iniciar sesión</a>
        <a href="./registro.html" class="btn-nav-accion">Registrar usuario</a>
        <a href="./carrito.html" class="btn-nav-accion" id="btnCarrito">🛒 Carrito (<span id="cantCarrito">0</span>)</a>
        <button class="btn-menu" id="btnMenu">☰</button>
      </div>
    </div>
  </header>

  
  <main class="contenedor-login">
    <div class="tarjeta-login">
      <h2>INICIO DE SESIÓN</h2>
      <p class="subtitulo-login">Ingresa a tu cuenta de El Bajón Urbano</p>
      
      <form class="formulario" id="formLogin" novalidate>
        
        <div class="campo-grupo">
          <label for="login-email">Correo Electrónico*</label>
          <input type="email" id="login-email" name="email" placeholder="ejemplo@duoc.cl" maxlength="100" required>
          <span class="msj-error" id="error-login-email"></span>
        </div>

        <div class="campo-grupo">
          <label for="login-password">Contraseña*</label>
          <input type="password" id="login-password" name="password" placeholder="Tu contraseña" maxlength="10" required>
          <span class="msj-error" id="error-login-password"></span>
        </div>

        <button type="submit" class="btn-login">INICIAR SESIÓN</button>
      </form>

      <p class="pie-login">¿No tienes cuenta? <a href="./registro.html">Regístrate aquí</a></p>
    </div>
  </main>

 
  <footer class="pie-pagina-completo">
    <div class="copy-final">
      <p>&copy; 2026 El Bajón Urbano. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
