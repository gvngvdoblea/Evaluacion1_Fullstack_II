<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Producto - Admin</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background-color: #000; border-right: 1px solid var(--color-borde); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar a { color: #fff; text-decoration: none; padding: 10px; border-radius: 4px; font-size: 14px; }
    .sidebar a:hover, .sidebar a.active { background-color: var(--color-primario); }
    .admin-content { flex: 1; padding: 30px; background-color: var(--color-fondo); }
  </style>
</head>
<body>

  <div class="admin-layout">
    <aside class="sidebar">
      <h2 style="font-size: 18px; color: var(--color-acento); margin-bottom: 20px;">ADMIN PANEL</h2>
      <a href="./index.html">Dashboard</a>
      <a href="./productos.html" class="active">Mantenedor Productos</a>
      <a href="./usuarios.html">Mantenedor Usuarios</a>
      <hr style="border-color: var(--color-borde); margin: 10px 0;">
      <a href="../../index.html" style="color: var(--color-texto-secundario);">Volver a la Tienda</a>
    </aside>

    <main class="admin-content">
      <h1 style="color: var(--color-primario); margin-bottom: 20px;">EDITAR PRODUCTO</h1>

      <div style="max-width: 600px; background: var(--color-tarjeta); padding: 25px; border-radius: 8px; border: 1px solid var(--color-borde);">
        <form id="formEditarProducto" novalidate>
          
          <div class="campo-grupo">
            <label for="edit-codigoProd">Código de Producto*</label>
            <input type="text" id="edit-codigoProd" value="PRD001" required>
          </div>

          <div class="campo-grupo">
            <label for="edit-nombreProd">Nombre del Producto*</label>
            <input type="text" id="edit-nombreProd" maxlength="100" value="Hamburguesa Clásica" required>
          </div>

          <div class="campo-grupo">
            <label for="edit-precioProd">Precio ($)*</label>
            <input type="number" id="edit-precioProd" min="0" value="5990" required>
          </div>

          <div class="campo-grupo">
            <label for="edit-stockProd">Stock*</label>
            <input type="number" id="edit-stockProd" min="0" value="15" required>
          </div>

          <button type="submit" class="btn-login" style="margin-top: 15px;">ACTUALIZAR PRODUCTO</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    document.getElementById("formEditarProducto").addEventListener("submit", (e) => {
      e.preventDefault();
      alert("¡Producto actualizado correctamente!");
      window.location.href = "./productos.html";
    });
  </script>
</body>
</html>
