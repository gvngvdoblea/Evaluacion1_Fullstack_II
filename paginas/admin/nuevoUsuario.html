<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Usuario - Admin</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background-color: #000; border-right: 1px solid var(--color-borde); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar a { color: #fff; text-decoration: none; padding: 10px; border-radius: 4px; font-size: 14px; }
    .sidebar a:hover, .sidebar a.active { background-color: var(--color-primario); }
    .admin-content { flex: 1; padding: 30px; background-color: var(--color-fondo); }
  </style>
</head>
<body>

  <div class="admin-layout">
    <aside class="sidebar">
      <h2 style="font-size: 18px; color: var(--color-acento); margin-bottom: 20px;">ADMIN PANEL</h2>
      <a href="./index.html">Dashboard</a>
      <a href="./productos.html">Mantenedor Productos</a>
      <a href="./usuarios.html" class="active">Mantenedor Usuarios</a>
      <hr style="border-color: var(--color-borde); margin: 10px 0;">
      <a href="../../index.html" style="color: var(--color-texto-secundario);">Volver a la Tienda</a>
    </aside>

    <main class="admin-content">
      <h1 style="color: var(--color-primario); margin-bottom: 20px;">NUEVO USUARIO</h1>

      <div style="max-width: 600px; background: var(--color-tarjeta); padding: 25px; border-radius: 8px; border: 1px solid var(--color-borde);">
        <form id="formAdminNuevoUsuario" novalidate>
          
          <div class="campo-grupo">
            <label for="admin-run">RUN (Sin puntos ni guión)*</label>
            <input type="text" id="admin-run" placeholder="19011022K" maxlength="9" required>
            <span class="msj-error" id="error-admin-run"></span>
          </div>

          <div class="campo-grupo">
            <label for="admin-nombre">Nombre*</label>
            <input type="text" id="admin-nombre" maxlength="50" placeholder="Nombre" required>
            <span class="msj-error" id="error-admin-nombre"></span>
          </div>

          <div class="campo-grupo">
            <label for="admin-apellidos">Apellidos*</label>
            <input type="text" id="admin-apellidos" maxlength="100" placeholder="Apellidos" required>
            <span class="msj-error" id="error-admin-apellidos"></span>
          </div>

          <div class="campo-grupo">
            <label for="admin-email">Correo Electrónico*</label>
            <input type="email" id="admin-email" maxlength="100" placeholder="ejemplo@duoc.cl" required>
            <span class="msj-error" id="error-admin-email"></span>
          </div>

          <!-- rol del usuario/ tipo -->
          <div class="campo-grupo">
            <label for="selectTipoUsuario">Tipo de Usuario (Rol)*</label>
            <select id="selectTipoUsuario" required>
              <option value="">-- Seleccione un Rol --</option>
              <option value="Administrador">Administrador</option>
              <option value="Vendedor">Vendedor</option>
              <option value="Cliente">Cliente</option>
            </select>
            <span class="msj-error" id="error-selectTipoUsuario"></span>
          </div>

          <div class="campo-grupo">
            <label for="selectRegion">Seleccione la región*</label>
            <select id="selectRegion" required>
              <option value="">-- Seleccione la región --</option>
            </select>
            <span class="msj-error" id="error-region"></span>
          </div>

          <div class="campo-grupo">
            <label for="selectComuna">Seleccione la comuna*</label>
            <select id="selectComuna" required disabled>
              <option value="">-- Seleccione la comuna --</option>
            </select>
            <span class="msj-error" id="error-comuna"></span>
          </div>

          <div class="campo-grupo">
            <label for="admin-direccion">Dirección*</label>
            <input type="text" id="admin-direccion" maxlength="300" placeholder="Calle, Número, Comuna" required>
            <span class="msj-error" id="error-admin-direccion"></span>
          </div>

          <button type="submit" class="btn-login" style="margin-top: 15px;">REGISTRAR USUARIO</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../../js/main.js"></script>
</body>
</html>
