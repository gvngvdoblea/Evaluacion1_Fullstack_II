<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - El Bajón Urbano</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-contenedor">
      <div class="nav-grupo-izq">
        <a href="../index.html" class="logo">El Bajón Urbano</a>
      </div>

      <div class="nav-grupo-der">
        <a href="../index.html" class="btn-nav">Inicio</a>
        <a href="../index.html#menu" class="btn-nav">Carta</a>
      </div>
    </div>
  </header>

  <main class="contenedor-login">
    <div class="tarjeta-login">
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo-login">Ingresa a tu cuenta de El Bajón Urbano</p>
      
      <form class="formulario" id="formLogin">
        <div class="campo-grupo">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="campo-grupo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <p class="pie-login">¿No tienes cuenta? <a href="./registro.html">Regístrate aquí</a></p>
    </div>
  </main>

  <footer class="pie-pagina-completo">
    <div class="copy-final" style="margin-top: 0; border-top: none;">
      <p>&copy; 2026 El Bajón Urbano. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
